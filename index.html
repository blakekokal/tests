<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Short Game Combines</title>
    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --green: #4caf50; --green-dk: #388e3c;
            --blue: #1565c0; --text: #e0e0e0; --muted: #999; --border: #333;
            --thead: #2c2c2c; --pos: #69f0ae; --neg: #ff5252;
            --inputbg: #2a2a2a; --locked: rgba(255,255,255,0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }

        header { background: #000; border-bottom: 2px solid var(--green); text-align: center; padding: 14px 0; position: sticky; top: 0; z-index: 200; box-shadow: 0 3px 10px rgba(0,0,0,.6); }
        header h1 { margin: 0; color: #fff; font-size: 1.4rem; letter-spacing: .5px; }

        .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 14px 12px; }

        /* HOME */
        .main-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .btn-giant { background: var(--green); color: #fff; border: none; padding: 14px 8px; font-size: 0.97rem; font-weight: 700; border-radius: 10px; cursor: pointer; line-height: 1.35; min-height: 66px; display: flex; align-items: center; justify-content: center; text-align: center; touch-action: manipulation; }
        .btn-giant.blue { background: var(--blue); }
        .btn-giant:active { filter: brightness(.8); }
        .btn-giant small { font-weight: 400; font-size: 0.82em; opacity: .85; }

        /* SETTINGS BAR — stable layout, never reflows */
        #settings-bar { display: none; background: #1c1c1c; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; padding: 10px 12px; }
        .settings-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
        .sg { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; white-space: nowrap; }
        .sg label { color: var(--muted); font-size: 0.78rem; }
        select, input[type="number"] { background: var(--inputbg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; padding: 7px 8px; -webkit-appearance: none; appearance: none; }
        /* HCP dims (never disappears) when in pts mode */
        #hcp-group.dimmed { opacity: .35; pointer-events: none; }
        .toggle-row { display: flex; background: var(--inputbg); border-radius: 6px; padding: 2px; border: 1px solid var(--border); }
        .tbtn { padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.82rem; font-weight: 700; color: var(--muted); touch-action: manipulation; user-select: none; }
        .tbtn.on { background: var(--green); color: #fff; }

        /* NAV */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .btn-back { background: #3a3a3a; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; touch-action: manipulation; }
        #tracker-title { margin: 0; color: var(--green); font-size: 1.05rem; text-align: center; flex: 1; padding: 0 8px; }

        /* SCOREBOARD */
        .scoreboard { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 8px; background: #1a3320; border: 1px solid var(--green-dk); padding: 12px; border-radius: 10px; margin-bottom: 14px; text-align: center; }
        .sbox h3 { margin: 0 0 3px; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .sbox .v { font-size: 1.55rem; font-weight: 700; color: #fff; }

        /* TABLE */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: var(--thead); color: var(--muted); font-size: 0.68rem; text-transform: uppercase; font-weight: 600; padding: 8px 4px; border: 1px solid var(--border); white-space: nowrap; }
        tbody td { border: 1px solid var(--border); text-align: center; height: 46px; padding: 0; }
        .hnum { background: var(--thead); font-weight: 700; color: #fff; width: 28px; font-size: 0.82rem; }
        .ro { background: var(--locked); font-weight: 700; font-size: 0.88rem; padding: 4px 3px; }
        .xbtn { background: transparent; color: var(--neg); border: none; font-size: 1.1rem; padding: 10px 8px; cursor: pointer; }

        /* TAP-TO-ENTER cells */
        /* tap-cell: just a wrapper for native input */

        select.cell-sel { width: 100%; height: 46px; border: none; background: transparent; color: var(--text); font-size: 1rem; text-align: center; padding: 0 4px; cursor: pointer; min-width: 96px; }
        /* Column widths for chipping tables */
        .col-dist { width: 68px; }
        .col-score { width: 72px; }
        .col-lie { width: 96px; }

        /* PUTT BUTTONS */
        .putt-grp { display: flex; gap: 3px; padding: 3px; height: 46px; align-items: center; }
        .pbtn { flex: 1; height: 38px; border: 1px solid var(--border); border-radius: 6px; background: var(--inputbg); color: var(--muted); font-size: 1.1rem; font-weight: 700; cursor: pointer; touch-action: manipulation; transition: background .1s; }
        .pbtn:active { background: var(--green-dk); color: #fff; }
        .pbtn.on { background: var(--green); color: #fff; border-color: var(--green); }

        .positive { color: var(--pos); font-weight: 700; }
        .negative { color: var(--neg); font-weight: 700; }

        /* Native input in tap cells */
        .tap-cell input {
            width: 100%; height: 100%; border: none; background: transparent;
            color: var(--text); text-align: center; font-size: 1.05rem; font-weight: 600;
            padding: 0 4px;
        }
        .tap-cell input:focus { background: #1a2a1a; outline: 2px solid var(--green); }

        /* VIEW SWITCH */
        .view { display: none; }
        .view.active { display: block; }

        @media (max-width: 420px) {
            header h1 { font-size: 1.2rem; }
            .btn-giant { font-size: 0.88rem; min-height: 60px; }
            .sbox .v { font-size: 1.3rem; }
            .nk { height: 58px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<header><h1>⛳ Short Game Combines</h1></header>


<div class="container">

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
        <div class="main-menu">
            <button class="btn-giant"      onclick="openTracker('putting','custom')">Putting - Custom</button>
            <button class="btn-giant blue" onclick="openTracker('putting','combine')">Putting - Combine</button>
            <button class="btn-giant"      onclick="openTracker('chip-prox','custom')">Chipping Prox<br>- Custom</button>
            <button class="btn-giant blue" onclick="openTracker('chip-prox','combine')">Chipping Prox<br>- Combine</button>
            <button class="btn-giant"      onclick="openTracker('chip-hole','custom')">Chip Hole Out<br>- Custom</button>
            <button class="btn-giant blue" onclick="openTracker('chip-hole','combine')">Chip Hole Out<br>- Combine</button>
            <button class="btn-giant"      onclick="openTracker('wedge','custom')">Wedge - Custom</button>
            <button class="btn-giant blue" onclick="openTracker('wedge','combine')">Wedge - Combine</button>
        </div>
    </div>

    <!-- SETTINGS BAR -->
    <div id="settings-bar">
        <div class="settings-row">
            <div class="sg" id="hcp-group">
                <label>HCP</label>
                <select id="global-handicap" onchange="recalculateAll()">
                    <option value="Tour Pro">Tour Pro</option>
                    <option value="Scratch" selected>Scratch</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                </select>
            </div>
            <div class="sg" id="wedge-score-grp" style="display:none">
                <label>Mode</label>
                <div class="toggle-row">
                    <div id="tbtn-sg"  class="tbtn on"  onclick="setWedgeScoring('sg')">SG</div>
                    <div id="tbtn-pts" class="tbtn"     onclick="setWedgeScoring('pts')">0–100</div>
                </div>
            </div>
            <div class="sg" id="qty-grp">
                <label># Holes</label>
                <input type="number" inputmode="numeric" id="holes-custom" value="9" min="1" style="width:52px" onchange="setupSpreadsheet()">
                <select id="holes-combine" style="display:none" onchange="setupSpreadsheet()">
                    <option id="opt-6" value="6">6</option>
                    <option value="9" selected>9</option>
                    <option value="18">18</option>
                </select>
            </div>
            <div class="sg" id="wedge-range-grp" style="display:none">
                <label>Yds</label>
                <input type="number" inputmode="numeric" id="w-min" value="30" style="width:62px">–<input type="number" inputmode="numeric" id="w-max" value="100" style="width:62px">
                <button onclick="setupSpreadsheet()" style="padding:7px 20px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;white-space:nowrap;">Gen</button>
            </div>
            <div class="sg" id="putting-type-grp" style="display:none">
                <label>Type</label>
                <select id="p-type" onchange="setupSpreadsheet()">
                    <option value="normal">Normal</option>
                    <option value="short">Short</option>
                </select>
            </div>
            <div class="sg" id="wedge-type-grp" style="display:none">
                <label>Type</label>
                <select id="w-type" onchange="setupSpreadsheet()">
                    <option value="std">Std 50–125</option>
                    <option value="jr">Jr 30–75</option>
                    <option value="jr-s">Jr-S 10–50</option>
                </select>
            </div>
        </div>
    </div>

    <!-- TRACKER VIEW -->
    <div id="tracker-view" class="view">
        <div class="nav-bar">
            <button class="btn-back" onclick="goHome()">← Menu</button>
            <h2 id="tracker-title">Tracker</h2>
            <div style="width:70px"></div>
        </div>
        <div class="scoreboard">
            <div class="sbox" id="exp-box">
                <h3>Expected</h3>
                <div class="v" id="total-exp">0.00</div>
            </div>
            <div class="sbox" id="strokes-box" style="display:none">
                <h3>Strokes</h3>
                <div class="v" id="total-strokes">0</div>
            </div>
            <div class="sbox">
                <h3 id="total-label">Total SG</h3>
                <div class="v" id="total-val">0.00</div>
            </div>
        </div>
        <div class="table-wrap">
            <table id="tracker-table">
                <thead id="tracker-head"></thead>
                <tbody id="tracker-body"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
/* ── HANDICAP DATA ── */
const handicapData = {
    putting:{
        2: {'Tour Pro':1,'Scratch':1,'5':1.01,'10':1.02,'15':1.055,'20':1.09,'25':1.13,'30':1.17},
        4: {'Tour Pro':1.19,'Scratch':1.23,'5':1.275,'10':1.32,'15':1.36,'20':1.4,'25':1.45,'30':1.5},
        10:{'Tour Pro':1.64,'Scratch':1.74,'5':1.80,'10':1.86,'15':1.915,'20':1.97,'25':2.04,'30':2.11},
        20:{'Tour Pro':1.88,'Scratch':2.02,'5':2.09,'10':2.16,'15':2.22,'20':2.28,'25':2.36,'30':2.44},
        30:{'Tour Pro':1.98,'Scratch':2.14,'5':2.215,'10':2.29,'15':2.355,'20':2.42,'25':2.51,'30':2.6},
        40:{'Tour Pro':2.06,'Scratch':2.22,'5':2.30,'10':2.38,'15':2.45,'20':2.52,'25':2.61,'30':2.7},
        50:{'Tour Pro':2.14,'Scratch':2.31,'5':2.405,'10':2.5,'15':2.565,'20':2.63,'25':2.72,'30':2.81}
    },
    chipping:{
        'Fairway':{
            10: {'Tour Pro':2.2,'Scratch':2.36,'5':2.50,'10':2.64,'15':2.80,'20':2.96,'25':3.095,'30':3.23},
            30: {'Tour Pro':2.5,'Scratch':2.68,'5':2.845,'10':3.01,'15':3.19,'20':3.37,'25':3.52,'30':3.67},
            50: {'Tour Pro':2.65,'Scratch':2.85,'5':3.02,'10':3.19,'15':3.38,'20':3.57,'25':3.73,'30':3.89},
            100:{'Tour Pro':2.8,'Scratch':3.01,'5':3.19,'10':3.37,'15':3.57,'20':3.77,'25':3.94,'30':4.11},
            125:{'Tour Pro':2.84,'Scratch':3.05,'5':3.23,'10':3.41,'15':3.62,'20':3.83,'25':4.01,'30':4.19}
        },
        'Rough':{
            10: {'Tour Pro':2.49,'Scratch':2.57,'5':2.74,'10':2.91,'15':3.085,'20':3.26,'25':3.44,'30':3.62},
            50: {'Tour Pro':2.85,'Scratch':2.95,'5':3.145,'10':3.34,'15':3.535,'20':3.73,'25':3.94,'30':4.15},
            100:{'Tour Pro':3.02,'Scratch':3.12,'5':3.325,'10':3.53,'15':3.74,'20':3.95,'25':4.17,'30':4.39}
        },
        'Sand':{
            10: {'Tour Pro':2.41,'Scratch':2.58,'5':2.725,'10':2.87,'15':3.04,'20':3.21,'25':3.365,'30':3.52},
            50: {'Tour Pro':2.98,'Scratch':3.19,'5':3.37,'10':3.55,'15':3.755,'20':3.96,'25':4.16,'30':4.36},
            100:{'Tour Pro':3.23,'Scratch':3.46,'5':3.655,'10':3.85,'15':4.075,'20':4.3,'25':4.51,'30':4.72}
        }
    }
};

const putCombines={short:[4,9,13,5,7,14,11,6,8,12,15,6,10,14,4,10,9,7],normal:[4,9,14,30,6,18,25,7,11,35,22,5,10,16,4,10,20,7]};
// Fixed combine scenarios with exact lie distributions
// 6-hole:  1 Sand, 3 Fairway, 2 Rough
// 9-hole:  2 Sand, 4 Fairway, 3 Rough
// 18-hole: 4 Sand, 8 Fairway, 6 Rough
const chipCombines = {
    6: [
        {d:10,l:'Sand'},
        {d:10,l:'Fairway'},{d:20,l:'Fairway'},{d:30,l:'Fairway'},
        {d:15,l:'Rough'},{d:25,l:'Rough'}
    ],
    9: [
        {d:10,l:'Sand'},{d:20,l:'Sand'},
        {d:10,l:'Fairway'},{d:15,l:'Fairway'},{d:20,l:'Fairway'},{d:30,l:'Fairway'},
        {d:10,l:'Rough'},{d:20,l:'Rough'},{d:25,l:'Rough'}
    ],
    18: [
        {d:10,l:'Sand'},{d:15,l:'Sand'},{d:20,l:'Sand'},{d:30,l:'Sand'},
        {d:10,l:'Fairway'},{d:15,l:'Fairway'},{d:20,l:'Fairway'},{d:20,l:'Fairway'},{d:25,l:'Fairway'},{d:25,l:'Fairway'},{d:30,l:'Fairway'},{d:30,l:'Fairway'},
        {d:10,l:'Rough'},{d:15,l:'Rough'},{d:20,l:'Rough'},{d:25,l:'Rough'},{d:25,l:'Rough'},{d:30,l:'Rough'}
    ]
};

/* ── APP ── */
let curMode='custom',curType='',wedgeMode='sg',state={};

function goHome(){
    showView('home-view');
    document.getElementById('settings-bar').style.display='none';
}

function openTracker(type,mode){
    curType=type; curMode=mode;
    showView('tracker-view');
    document.getElementById('settings-bar').style.display='block';
    const isCombine=mode==='combine', isWedge=type==='wedge', isPut=type==='putting';
    vis('holes-custom',!isCombine); vis('holes-combine',isCombine);
    vis('wedge-score-grp',isWedge); vis('wedge-range-grp',isWedge&&!isCombine);
    vis('putting-type-grp',isPut&&isCombine); vis('wedge-type-grp',isWedge&&isCombine);
    document.getElementById('opt-6').style.display=isWedge?'none':'';
    document.getElementById('strokes-box').style.display=(type==='putting'||type==='chip-hole')?'block':'none';
    const names={putting:'Putting','chip-prox':'Chipping (Prox)','chip-hole':'Chip Hole Out',wedge:'Wedge'};
    document.getElementById('tracker-title').textContent=(isCombine?'[COMBINE] ':'')+names[type];
    if(isWedge) setWedgeScoring(wedgeMode,false);
    else { document.getElementById('hcp-group').classList.remove('dimmed'); document.getElementById('exp-box').style.display='block'; }
    setupSpreadsheet();
}

function vis(id,show){ const el=document.getElementById(id); if(el) el.style.display=show?'':'none'; }
function showView(id){ ['home-view','tracker-view'].forEach(v=>document.getElementById(v).classList.toggle('active',v===id)); }

function setupSpreadsheet(){
    const holes=curMode==='custom'?+document.getElementById('holes-custom').value:+document.getElementById('holes-combine').value;
    const head=document.getElementById('tracker-head'), body=document.getElementById('tracker-body');
    head.innerHTML=''; body.innerHTML=''; state={};

    let h=`<tr><th class="hnum">#</th>`;
    if(curType==='putting')    h+=`<th>Dist ft</th><th>Putts</th><th>Exp</th><th>SG</th>`;
    else if(curType==='wedge') h+=`<th>Target</th><th>Carry</th><th>Prox ft</th><th class="wsg">Exp S</th><th class="wsg">Exp P</th><th class="wsg">Total</th><th id="w-last">SG</th>`;
    else if(curType==='chip-prox') h+=`<th class="col-dist">Dist yd</th><th class="col-lie">Lie</th><th class="col-score">Prox ft</th><th>Exp S</th><th>Exp P</th><th>Total</th><th>SG</th>`;
    else h+=`<th class="col-dist">Dist yd</th><th class="col-lie">Lie</th><th class="col-score">Score</th><th>Exp</th><th>SG</th>`;
    head.innerHTML=h+`<th></th></tr>`;

    let pD=[],wD=[],cS=[];
    if(curMode==='combine'){
        if(curType==='putting') pD=putCombines[document.getElementById('p-type').value].slice(0,holes).sort(()=>Math.random()-.5);
        if(curType==='wedge'){const t=document.getElementById('w-type').value,mn=t==='std'?50:t==='jr'?30:10,mx=t==='std'?125:t==='jr'?75:50;wD=genU(holes,mn,mx,5);}
        const src = chipCombines[holes] || chipCombines[18].slice(0,holes);
        cS = [...src].sort(()=>Math.random()-.5);
    } else if(curType==='wedge'){wD=genU(holes,+document.getElementById('w-min').value,+document.getElementById('w-max').value,5);}

    for(let i=1;i<=holes;i++){
        state[i]={d:'',l:'Fairway',v:'',sg:0,pts:0,exp1:0};
        let r=`<tr><td class="hnum">${i}</td>`;
        if(curType==='putting'){
            const d=curMode==='combine'?pD[i-1]:''; state[i].d=d;
            r+=curMode==='combine'?`<td class="ro">${d}</td>`:`<td class="tap-cell"><input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="–" onchange="upd(${i},'d',+this.value)"></td>`;
            r+=`<td><div class="putt-grp" id="pg-${i}"><button class="pbtn" onclick="setPutts(${i},1)">1</button><button class="pbtn" onclick="setPutts(${i},2)">2</button><button class="pbtn" onclick="setPutts(${i},3)">3</button></div></td><td class="ro" id="e1-${i}">–</td><td class="ro" id="sg-${i}">–</td>`;
        } else if(curType==='wedge'){
            state[i].d=wD[i-1];
            r+=`<td class="ro">${wD[i-1]}</td><td class="tap-cell"><input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="–" onchange="upd(${i},'v',+this.value)"></td><td class="ro" id="px-${i}">–</td><td class="ro wsg" id="e1-${i}">–</td><td class="ro wsg" id="e2-${i}">–</td><td class="ro wsg" id="ts-${i}">–</td><td class="ro" id="sg-${i}">–</td>`;
        } else if(curType==='chip-prox'){
            const d=curMode==='combine'?cS[i-1].d:'',l=curMode==='combine'?cS[i-1].l:'Fairway'; state[i].d=d; state[i].l=l;
            r+=curMode==='combine'?`<td class="ro col-dist">${d}</td><td class="ro col-lie">${l}</td>`:`<td class="tap-cell col-dist"><input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="–" onchange="upd(${i},'d',+this.value)"></td><td class="col-lie"><select class="cell-sel" onchange="upd(${i},'l',this.value)"><option>Fairway</option><option>Rough</option><option>Sand</option></select></td>`;
            r+=`<td class="tap-cell col-score"><input type="number" inputmode="decimal" placeholder="–" onchange="upd(${i},'v',+this.value)"></td><td class="ro" id="e1-${i}">–</td><td class="ro" id="e2-${i}">–</td><td class="ro" id="ts-${i}">–</td><td class="ro" id="sg-${i}">–</td>`;
        } else {
            const d=curMode==='combine'?cS[i-1].d:'',l=curMode==='combine'?cS[i-1].l:'Fairway'; state[i].d=d; state[i].l=l;
            r+=curMode==='combine'?`<td class="ro col-dist">${d}</td><td class="ro col-lie">${l}</td>`:`<td class="tap-cell col-dist"><input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="–" onchange="upd(${i},'d',+this.value)"></td><td class="col-lie"><select class="cell-sel" onchange="upd(${i},'l',this.value)"><option>Fairway</option><option>Rough</option><option>Sand</option></select></td>`;
            r+=`<td class="tap-cell col-score"><input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="–" onchange="upd(${i},'v',+this.value)"></td><td class="ro" id="e1-${i}">–</td><td class="ro" id="sg-${i}">–</td>`;
        }
        body.innerHTML+=r+`<td><button class="xbtn" onclick="delRow(${i})">✕</button></td></tr>`;
    }
    if(curType==='wedge') setWedgeScoring(wedgeMode,false);
    recalculateAll();
}

function setPutts(i,val){
    document.getElementById(`pg-${i}`).querySelectorAll('.pbtn').forEach((b,idx)=>b.classList.toggle('on',idx+1===val));
    upd(i,'v',val);
}
function delRow(i){
    delete state[i];
    document.querySelectorAll('#tracker-body tr').forEach(row=>{if(row.querySelector('.hnum')&&+row.querySelector('.hnum').textContent===i)row.remove();});
    updateT();
}
function upd(i,f,v){state[i][f]=v;calcR(i);}

function calcR(i){
    const r=state[i]; if(!r) return;
    const h=document.getElementById('global-handicap').value;
    if(r.d===''||r.v==='') return;
    if(curType==='putting'){
        r.exp1=getE('putting',r.d,null,h); r.sg=r.exp1-r.v;
        document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
        document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
    } else if(curType==='wedge'){
        const px=Math.abs(r.d-r.v)*3; document.getElementById(`px-${i}`).textContent=px.toFixed(1);
        if(wedgeMode==='sg'){
            r.exp1=getE('chipping',r.d,'Fairway',h); const e2=getE('putting',px,null,h),ts=1+e2; r.sg=r.exp1-ts;
            document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
            document.getElementById(`e2-${i}`).textContent=e2.toFixed(2);
            document.getElementById(`ts-${i}`).textContent=ts.toFixed(2);
            document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
        } else {r.pts=Math.max(0,100-px);document.getElementById(`sg-${i}`).textContent=r.pts.toFixed(0);}
    } else if(curType==='chip-prox'){
        r.exp1=getE('chipping',r.d,r.l,h); const e2=getE('putting',r.v,null,h),ts=1+e2; r.sg=r.exp1-ts;
        document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
        document.getElementById(`e2-${i}`).textContent=e2.toFixed(2);
        document.getElementById(`ts-${i}`).textContent=ts.toFixed(2);
        document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
    } else {
        r.exp1=getE('chipping',r.d,r.l,h); r.sg=r.exp1-r.v;
        document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
        document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
    }
    updateT();
}

function getE(t,d,l,h){
    const ds=t==='putting'?handicapData.putting:handicapData.chipping[l];
    const ks=Object.keys(ds).map(Number).sort((a,b)=>a-b);
    const c=ks.reduce((p,n)=>Math.abs(n-d)<Math.abs(p-d)?n:p);
    return ds[c][h];
}

function updateT(){
    let sg=0,e=0,strokes=0,c=0;
    for(const k in state){if(state[k].v!==''){sg+=(curType==='wedge'&&wedgeMode==='pts')?state[k].pts:state[k].sg;e+=state[k].exp1;strokes+=parseFloat(state[k].v)||0;c++;}}
    document.getElementById('total-exp').textContent=e.toFixed(2);
    document.getElementById('total-val').innerHTML=(curType==='wedge'&&wedgeMode==='pts')?(c?(sg/c).toFixed(1):'0.0'):fmt(sg);
    if(curType==='putting'||curType==='chip-hole') document.getElementById('total-strokes').textContent=strokes;
}

function setWedgeScoring(m,recalc=true){
    wedgeMode=m;
    document.getElementById('tbtn-sg').classList.toggle('on',m==='sg');
    document.getElementById('tbtn-pts').classList.toggle('on',m==='pts');
    // HCP dims but STAYS — no layout shift
    document.getElementById('hcp-group').classList.toggle('dimmed',m==='pts');
    document.querySelectorAll('.wsg').forEach(el=>el.style.display=m==='sg'?'':'none');
    document.getElementById('exp-box').style.display=m==='sg'?'block':'none';
    const wl=document.getElementById('w-last'); if(wl) wl.textContent=m==='sg'?'SG':'Score';
    document.getElementById('total-label').textContent=m==='sg'?'Total SG':'Avg Pts';
    if(recalc) recalculateAll();
}

function recalculateAll(){for(const k in state)calcR(k);}
function fmt(v){return v>0?`<span class="positive">+${v.toFixed(2)}</span>`:`<span class="negative">${v.toFixed(2)}</span>`;}
function genU(n,min,max,gap){let res=[],pool=Array.from({length:max-min+1},(_,i)=>i+min);for(let i=0;i<n;i++){let ok=pool.filter(x=>res.length===0||Math.abs(x-res[res.length-1])>=gap);if(!ok.length)ok=pool;const p=ok[Math.floor(Math.random()*ok.length)];res.push(p);pool=pool.filter(x=>x!==p);}return res;}
</script>
