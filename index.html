<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Game Combines</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #4caf50;
            --primary-dark: #388e3c;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --table-header: #2c2c2c;
            --positive: #69f0ae;
            --negative: #ff5252;
            --input-bg: #2a2a2a;
            --danger: #ff5252;
            --locked-bg: rgba(255, 255, 255, 0.05);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }
        
        header {
            background-color: #000000;
            border-bottom: 2px solid var(--primary);
            width: 100%; text-align: center; padding: 1.2rem 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        h1 { margin: 0; color: #ffffff; font-size: 1.8rem;}
        
        .container {
            width: 95%; max-width: 1200px; margin: 1.5rem auto;
            background: var(--card-bg); border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); padding: 1.5rem;
            min-height: 75vh;
        }

        .main-menu {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-top: 20px; max-width: 900px; margin-left: auto; margin-right: auto;
        }

        .btn-giant {
            background-color: var(--primary); color: #fff; border: none;
            padding: 15px; font-size: 1.1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            height: 70px; display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .btn-giant.combine-btn { background-color: #1565c0; }
        .btn-giant:hover { filter: brightness(1.15); transform: translateY(-2px); }

        .global-settings {
            background: #252525; padding: 15px; border-radius: 8px;
            margin-bottom: 20px; display: none; gap: 20px;
            border: 1px solid var(--border-color); align-items: center; justify-content: center;
            flex-wrap: wrap;
        }
        .setting-group { display: flex; align-items: center; gap: 8px; }
        select, input[type="number"] {
            padding: 8px; background-color: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem;
        }

        .scoreboard {
            display: flex; justify-content: center; gap: 30px;
            background: #1a3320; border: 1px solid var(--primary-dark);
            padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;
        }
        .score-box h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .score-box .val { font-size: 1.8rem; font-weight: bold; }
        .score-box .val-neutral { color: #fff; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }

        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-back { background-color: #424242; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        .spreadsheet { width: 100%; border-collapse: collapse; }
        .spreadsheet th {
            background-color: var(--table-header); color: var(--text-muted);
            font-weight: 600; text-transform: uppercase; font-size: 0.75rem;
            padding: 10px 5px; border: 1px solid var(--border-color);
        }
        .spreadsheet td { padding: 0; border: 1px solid var(--border-color); text-align: center; height: 40px; }
        .cell-input { width: 100%; height: 100%; border: none; background: transparent; color: var(--text-main); text-align: center; font-size: 1rem; }
        .cell-input:focus { background: #222; outline: 2px solid var(--primary); }
        .readonly-cell { padding: 5px; font-weight: bold; background-color: var(--locked-bg); }
        .positive { color: var(--positive); }
        .negative { color: var(--negative); }
        .hole-num { background: var(--table-header); font-weight: bold; color: #fff; width: 40px; }
        .btn-delete { background: transparent; color: var(--danger); border: none; cursor: pointer; font-weight: bold; }

        .toggle-container { display: flex; background: var(--input-bg); border-radius: 6px; padding: 2px; border: 1px solid var(--border-color); }
        .toggle-btn { padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .toggle-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <header><h1>Short Game Combines</h1></header>

    <div class="container">
        <div id="home-view" class="view active">
            <div class="main-menu">
                <button class="btn-giant" onclick="openTracker('putting', 'custom')">Putting - Custom</button>
                <button class="btn-giant combine-btn" onclick="openTracker('putting', 'combine')">Putting - Combine</button>
                <button class="btn-giant" onclick="openTracker('chip-prox', 'custom')">Chipping (Prox) - Custom</button>
                <button class="btn-giant combine-btn" onclick="openTracker('chip-prox', 'combine')">Chipping (Prox) - Combine</button>
                <button class="btn-giant" onclick="openTracker('chip-hole', 'custom')">Chipping (Hole Out) - Custom</button>
                <button class="btn-giant combine-btn" onclick="openTracker('chip-hole', 'combine')">Chipping (Hole Out) - Combine</button>
                <button class="btn-giant" onclick="openTracker('wedge', 'custom')">Wedge - Custom</button>
                <button class="btn-giant combine-btn" onclick="openTracker('wedge', 'combine')">Wedge - Combine</button>
            </div>
        </div>

        <div id="settings-bar" class="global-settings">
            <div class="setting-group" id="hcp-group">
                <label>Handicap:</label>
                <select id="global-handicap" onchange="recalculateAll()">
                    <option value="Tour Pro">Tour Pro</option>
                    <option value="Scratch" selected>Scratch</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                </select>
            </div>
            
            <div class="setting-group" id="wedge-score-toggle-group" style="display:none">
                <label>Scoring:</label>
                <div class="toggle-container">
                    <div id="mode-sg" class="toggle-btn active" onclick="setWedgeScoring('sg')">SG</div>
                    <div id="mode-pts" class="toggle-btn" onclick="setWedgeScoring('pts')">0-100</div>
                </div>
            </div>

            <div class="setting-group" id="qty-group">
                <label id="label-qty"># of Holes:</label>
                <input type="number" id="holes-custom" value="9" min="1" onchange="setupSpreadsheet()" style="width: 50px;">
                <select id="holes-combine" onchange="setupSpreadsheet()" style="display:none">
                    <option id="opt-6" value="6">6</option>
                    <option value="9" selected>9</option>
                    <option value="18">18</option>
                </select>
            </div>

            <div class="setting-group" id="wedge-custom-range" style="display:none">
                <label>Range:</label>
                <input type="number" id="w-min" value="30" style="width:50px"> to <input type="number" id="w-max" value="100" style="width:50px">
                <button onclick="setupSpreadsheet()">Gen</button>
            </div>

            <div class="setting-group" id="putting-type-group" style="display:none">
                <label>Type:</label>
                <select id="p-type" onchange="setupSpreadsheet()">
                    <option value="normal">Normal</option>
                    <option value="short">Short</option>
                </select>
            </div>

            <div class="setting-group" id="wedge-type-group" style="display:none">
                <label>Type:</label>
                <select id="w-type" onchange="setupSpreadsheet()">
                    <option value="std">Standard (50-125)</option>
                    <option value="jr">Junior (30-75)</option>
                    <option value="jr-s">Jr Short (10-50)</option>
                </select>
            </div>
        </div>

        <div id="tracker-view" class="view">
            <div class="nav-bar">
                <button class="btn-back" onclick="goHome()">← Menu</button>
                <h2 id="tracker-title" style="margin:0; color:var(--primary);">Tracker</h2>
                <div style="width:60px"></div>
            </div>

            <div class="scoreboard">
                <div class="score-box" id="exp-box">
                    <h3>Expected Total</h3>
                    <div class="val val-neutral" id="total-exp">0.00</div>
                </div>
                <div class="score-box">
                    <h3 id="total-label">Total SG</h3>
                    <div class="val" id="total-val">0.00</div>
                </div>
            </div>

            <table class="spreadsheet" id="tracker-table">
                <thead id="tracker-head"></thead>
                <tbody id="tracker-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const handicapData = {
            putting: {
                2: {'Tour Pro':1, 'Scratch':1, '10':1.02, '20':1.09, '30':1.17},
                4: {'Tour Pro':1.19, 'Scratch':1.23, '10':1.32, '20':1.4, '30':1.5},
                10: {'Tour Pro':1.64, 'Scratch':1.74, '10':1.86, '20':1.97, '30':2.11},
                20: {'Tour Pro':1.88, 'Scratch':2.02, '10':2.16, '20':2.28, '30':2.44},
                30: {'Tour Pro':1.98, 'Scratch':2.14, '10':2.29, '20':2.42, '30':2.6},
                40: {'Tour Pro':2.06, 'Scratch':2.22, '10':2.38, '20':2.52, '30':2.7},
                50: {'Tour Pro':2.14, 'Scratch':2.31, '10':2.5, '20':2.63, '30':2.81}
            },
            chipping: { 
                'Fairway': {
                    10: {'Tour Pro':2.2, 'Scratch':2.36, '10':2.64, '20':2.96, '30':3.23},
                    30: {'Tour Pro':2.5, 'Scratch':2.68, '10':3.01, '20':3.37, '30':3.67},
                    50: {'Tour Pro':2.65, 'Scratch':2.85, '10':3.19, '20':3.57, '30':3.89},
                    100: {'Tour Pro':2.8, 'Scratch':3.01, '10':3.37, '20':3.77, '30':4.11},
                    125: {'Tour Pro':2.84, 'Scratch':3.05, '10':3.41, '20':3.83, '30':4.19}
                },
                'Rough': {
                    10: {'Tour Pro':2.49, 'Scratch':2.57, '10':2.91, '20':3.26, '30':3.62},
                    50: {'Tour Pro':2.85, 'Scratch':2.95, '10':3.34, '20':3.73, '30':4.15},
                    100: {'Tour Pro':3.02, 'Scratch':3.12, '10':3.53, '20':3.95, '30':4.39}
                },
                'Sand': {
                    10: {'Tour Pro':2.41, 'Scratch':2.58, '10':2.87, '20':3.21, '30':3.52},
                    50: {'Tour Pro':2.98, 'Scratch':3.19, '10':3.55, '20':3.96, '30':4.36},
                    100: {'Tour Pro':3.23, 'Scratch':3.46, '10':3.85, '20':4.3, '30':4.72}
                }
            }
        };

        const putCombines = {
            short: [4, 9, 13, 5, 7, 14, 11, 6, 8, 12, 15, 6, 10, 14, 4, 10, 9, 7],
            normal: [4, 9, 14, 30, 6, 18, 25, 7, 11, 35, 22, 5, 10, 16, 4, 10, 20, 7]
        };

        const chipScen = [
            {d:10, l:'Fairway'}, {d:15, l:'Rough'}, {d:20, l:'Sand'}, {d:25, l:'Fairway'}, {d:30, l:'Rough'},
            {d:12, l:'Sand'}, {d:18, l:'Fairway'}, {d:22, l:'Rough'}, {d:28, l:'Sand'}, {d:8, l:'Fairway'},
            {d:14, l:'Rough'}, {d:19, l:'Sand'}, {d:24, l:'Fairway'}, {d:29, l:'Rough'}, {d:11, l:'Sand'},
            {d:16, l:'Fairway'}, {d:21, l:'Rough'}, {d:27, l:'Sand'}
        ];

        let curMode = 'custom'; let curType = ''; let wedgeScoreMode = 'sg'; let state = {};

        function goHome() {
            document.getElementById('tracker-view').classList.remove('active');
            document.getElementById('settings-bar').style.display = 'none';
            document.getElementById('home-view').classList.add('active');
        }

        function openTracker(type, mode) {
            curType = type; curMode = mode;
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('tracker-view').classList.add('active');
            document.getElementById('settings-bar').style.display = 'flex';
            
            document.getElementById('holes-custom').style.display = (mode === 'custom') ? 'block' : 'none';
            document.getElementById('holes-combine').style.display = (mode === 'combine') ? 'block' : 'none';
            document.getElementById('putting-type-group').style.display = (type === 'putting' && mode === 'combine') ? 'block' : 'none';
            document.getElementById('wedge-type-group').style.display = (type === 'wedge' && mode === 'combine') ? 'block' : 'none';
            document.getElementById('wedge-custom-range').style.display = (type === 'wedge' && mode === 'custom') ? 'block' : 'none';
            document.getElementById('wedge-score-toggle-group').style.display = (type === 'wedge') ? 'block' : 'none';
            document.getElementById('opt-6').style.display = (type === 'wedge') ? 'none' : 'block';
            
            let names = {'putting':'Putting','chip-prox':'Chipping (Prox)','chip-hole':'Chipping (Hole Out)','wedge':'Wedge Combine'};
            document.getElementById('tracker-title').textContent = (mode === 'combine' ? '[COMBINE] ' : '') + names[type];
            setupSpreadsheet();
        }

        function setupSpreadsheet() {
            const holes = (curMode === 'custom') ? parseInt(document.getElementById('holes-custom').value) : parseInt(document.getElementById('holes-combine').value);
            const head = document.getElementById('tracker-head');
            const body = document.getElementById('tracker-body');
            head.innerHTML = ''; body.innerHTML = ''; state = {};

            let cols = `<tr><th class="hole-num">#</th>`;
            if(curType === 'putting') cols += `<th>Dist (ft)</th><th>Putts</th><th>Exp</th><th>SG</th>`;
            else if(curType === 'wedge') cols += `<th>Target</th><th>Carry</th><th>Prox (ft)</th><th class="w-sg">Exp S</th><th class="w-sg">Exp P</th><th class="w-sg">Total</th><th id="w-last">SG</th>`;
            else if(curType === 'chip-prox') cols += `<th>Dist (yds)</th><th>Lie</th><th>Prox (ft)</th><th>Exp S</th><th>Exp P</th><th>Total</th><th>SG</th>`;
            else cols += `<th>Dist (yds)</th><th>Lie</th><th>Score</th><th>Exp</th><th>SG</th>`;
            head.innerHTML = cols + `<th>X</th></tr>`;

            let pD = [], wD = [], cS = [];
            if(curMode === 'combine') {
                if(curType === 'putting') pD = putCombines[document.getElementById('p-type').value].slice(0, holes).sort(()=>Math.random()-0.5);
                if(curType === 'wedge') {
                    let t = document.getElementById('w-type').value;
                    let min = (t==='std')?50:(t==='jr')?30:10;
                    let max = (t==='std')?125:(t==='jr')?75:50;
                    wD = genU(holes, min, max, 5);
                }
                cS = chipScen.slice(0, holes).sort(()=>Math.random()-0.5);
            } else if(curType === 'wedge') {
                wD = genU(holes, parseInt(document.getElementById('w-min').value), parseInt(document.getElementById('w-max').value), 5);
            }

            for(let i=1; i<=holes; i++) {
                state[i] = {d:'', l:'Fairway', v:'', sg:0, pts:0, exp1:0};
                let r = `<tr><td class="hole-num">${i}</td>`;
                if(curType === 'putting') {
                    let d = (curMode==='combine')?pD[i-1]:''; state[i].d=d;
                    r += (curMode==='combine')?`<td class="readonly-cell">${d}</td>`:`<td><input type="number" class="cell-input" onchange="upd(${i},'d',this.value)"></td>`;
                    r += `<td><input type="number" class="cell-input" onchange="upd(${i},'v',this.value)"></td><td class="readonly-cell" id="e1-${i}">-</td><td class="readonly-cell" id="sg-${i}">-</td>`;
                } else if(curType === 'wedge') {
                    state[i].d = wD[i-1];
                    r += `<td class="readonly-cell">${wD[i-1]}</td><td><input type="number" class="cell-input" onchange="upd(${i},'v',this.value)"></td><td class="readonly-cell" id="px-${i}">-</td><td class="readonly-cell w-sg" id="e1-${i}">-</td><td class="readonly-cell w-sg" id="e2-${i}">-</td><td class="readonly-cell w-sg" id="ts-${i}">-</td><td class="readonly-cell" id="sg-${i}">-</td>`;
                } else if(curType === 'chip-prox') {
                    let d = (curMode==='combine')?cS[i-1].d:''; let l = (curMode==='combine')?cS[i-1].l:'Fairway';
                    state[i].d=d; state[i].l=l;
                    r += (curMode==='combine')?`<td class="readonly-cell">${d}</td><td class="readonly-cell">${l}</td>`:`<td><input type="number" class="cell-input" onchange="upd(${i},'d',this.value)"></td><td><select class="cell-input" onchange="upd(${i},'l',this.value)"><option>Fairway</option><option>Rough</option><option>Sand</option></select></td>`;
                    r += `<td><input type="number" class="cell-input" onchange="upd(${i},'v',this.value)"></td><td class="readonly-cell" id="e1-${i}">-</td><td class="readonly-cell" id="e2-${i}">-</td><td class="readonly-cell" id="ts-${i}">-</td><td class="readonly-cell" id="sg-${i}">-</td>`;
                } else {
                    let d = (curMode==='combine')?cS[i-1].d:''; let l = (curMode==='combine')?cS[i-1].l:'Fairway';
                    state[i].d=d; state[i].l=l;
                    r += (curMode==='combine')?`<td class="readonly-cell">${d}</td><td class="readonly-cell">${l}</td>`:`<td><input type="number" class="cell-input" onchange="upd(${i},'d',this.value)"></td><td><select class="cell-input" onchange="upd(${i},'l',this.value)"><option>Fairway</option><option>Rough</option><option>Sand</option></select></td>`;
                    r += `<td><input type="number" class="cell-input" onchange="upd(${i},'v',this.value)"></td><td class="readonly-cell" id="e1-${i}">-</td><td class="readonly-cell" id="sg-${i}">-</td>`;
                }
                body.innerHTML += r + `<td><button class="btn-delete" onclick="setupSpreadsheet()">X</button></td></tr>`;
            }
            if(curType==='wedge') setWedgeScoring(wedgeScoreMode);
            recalculateAll();
        }

        function upd(i,f,v){ state[i][f]=v; calcR(i); }

        function calcR(i) {
            let r=state[i]; let h=document.getElementById('global-handicap').value;
            if(!r.d || r.v==='') return;
            if(curType==='putting'){
                r.exp1=getE('putting',r.d,null,h); r.sg=r.exp1-r.v;
                document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
                document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
            } else if(curType==='wedge'){
                let px = Math.abs(r.d - r.v) * 3; document.getElementById(`px-${i}`).textContent = px;
                if(wedgeScoreMode==='sg'){
                    r.exp1=getE('chipping',r.d,'Fairway',h); let e2=getE('putting',px,null,h);
                    let ts=1+e2; r.sg=r.exp1-ts;
                    document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
                    document.getElementById(`e2-${i}`).textContent=e2.toFixed(2);
                    document.getElementById(`ts-${i}`).textContent=ts.toFixed(2);
                    document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
                } else { r.pts=Math.max(0,100-px); document.getElementById(`sg-${i}`).textContent=r.pts.toFixed(0); }
            } else if(curType==='chip-prox'){
                r.exp1=getE('chipping',r.d,r.l,h); let e2=getE('putting',r.v,null,h);
                let ts=1+e2; r.sg=r.exp1-ts;
                document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
                document.getElementById(`e2-${i}`).textContent=e2.toFixed(2);
                document.getElementById(`ts-${i}`).textContent=ts.toFixed(2);
                document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
            } else {
                r.exp1=getE('chipping',r.d,r.l,h); r.sg=r.exp1-r.v;
                document.getElementById(`e1-${i}`).textContent=r.exp1.toFixed(2);
                document.getElementById(`sg-${i}`).innerHTML=fmt(r.sg);
            }
            updateT();
        }

        function getE(t,d,l,h){
            let ds=(t==='putting')?handicapData.putting:handicapData.chipping[l];
            let ks=Object.keys(ds).map(Number).sort((a,b)=>a-b);
            let c=ks.reduce((p,n)=>Math.abs(n-d)<Math.abs(p-d)?n:p);
            return ds[c][h];
        }

        function updateT(){
            let s=0, e=0, c=0;
            for(let k in state){ if(state[k].v!==''){ s+=(curType==='wedge'&&wedgeScoreMode==='pts')?state[k].pts:state[k].sg; e+=state[k].exp1; c++; }}
            document.getElementById('total-exp').textContent=e.toFixed(2);
            document.getElementById('total-val').innerHTML=(curType==='wedge'&&wedgeScoreMode==='pts')?(c?(s/c).toFixed(1):'0.0'):fmt(s);
        }

        function setWedgeScoring(m){
            wedgeScoreMode=m;
            document.getElementById('mode-sg').classList.toggle('active',m==='sg');
            document.getElementById('mode-pts').classList.toggle('active',m==='pts');
            document.querySelectorAll('.w-sg').forEach(el=>el.style.display=(m==='sg')?'':'none');
            document.getElementById('exp-box').style.display=(m==='sg')?'block':'none';
            document.getElementById('hcp-group').style.display=(m==='sg')?'flex':'none';
            document.getElementById('w-last').textContent=(m==='sg')?'SG':'Score';
            document.getElementById('total-label').textContent=(m==='sg')?'Total SG':'Avg Pts';
            recalculateAll();
        }

        function recalculateAll(){ for(let k in state) calcR(k); }
        function fmt(v){ return v>0?`<span class="positive">+${v.toFixed(2)}</span>`:`<span class="negative">${v.toFixed(2)}</span>`; }
        function genU(n,min,max,g){
            let r=[]; let a=Array.from({length:max-min+1},(_,i)=>i+min);
            for(let i=0; i<n; i++){
                let v=a.filter(x=>r.length===0||Math.abs(x-r[r.length-1])>=g);
                if(!v.length)v=a; let p=v[Math.floor(Math.random()*v.length)];
                r.push(p); a=a.filter(x=>x!==p);
            } return r;
        }
    </script>
</body>
</html>
