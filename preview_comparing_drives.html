<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Comparing Two Drives</title></head>
<body style="background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;">
<div style="width:380px;">
<svg viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1f0d" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="380" height="220" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="190" y="28" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Comparing Two Drives</text>

  <!-- Ground -->
  <rect x="0" y="110" width="380" height="110" fill="url(#grass)" rx="0"/>

  <!-- Fairway path -->
  <path d="M35,170 Q140,155 220,138 Q290,120 340,95" fill="none" stroke="#2e7d32" stroke-width="32" stroke-linecap="round" opacity="0.4"/>

  <!-- Putting green -->
  <ellipse cx="342" cy="80" rx="30" ry="24" fill="#1b5e20" opacity="0.7"/>
  <ellipse cx="342" cy="80" rx="24" ry="19" fill="#2e7d32" opacity="0.8"/>

  <!-- Flag -->
  <line x1="346" y1="80" x2="346" y2="52" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="346,52 360,57 346,62" fill="#f44336"/>

  <!-- Tee box -->
  <rect x="20" y="166" width="22" height="10" rx="3" fill="#388e3c"/>
  <circle cx="31" cy="164" r="4" fill="#ffffff"/>

  <!-- TEE label -->
  <text x="31" y="192" fill="#888888" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">TEE</text>

  <!-- Player 1 arc (250 yards, lands 150 out) -->
  <path d="M31,164 Q105,80 185,142" fill="none" stroke="#64b5f6" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.9"/>
  <!-- P1 ball -->
  <circle cx="185" cy="142" r="8" fill="#1565c0" stroke="#64b5f6" stroke-width="2"/>
  <text x="185" y="146" fill="#ffffff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" font-weight="800">P1</text>

  <!-- Player 2 arc (300 yards, lands 100 out) -->
  <path d="M31,164 Q160,40 258,118" fill="none" stroke="#69f0ae" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.9"/>
  <!-- P2 ball -->
  <circle cx="258" cy="118" r="8" fill="#0f766e" stroke="#69f0ae" stroke-width="2"/>
  <text x="258" y="122" fill="#ffffff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" font-weight="800">P2</text>

  <!-- P1 yardage label (250 yds) -->
  <rect x="68" y="85" width="70" height="22" rx="11" fill="#1565c0" opacity="0.9"/>
  <text x="103" y="100" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">250 Yards</text>

  <!-- P2 yardage label (300 yds) -->
  <rect x="120" y="48" width="70" height="22" rx="11" fill="#0f766e" opacity="0.9"/>
  <text x="155" y="63" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">300 Yards</text>

  <!-- P1 distance remaining -->
  <text x="185" y="162" fill="#cccccc" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">150 Yards Out</text>

  <!-- P2 distance remaining -->
  <text x="258" y="138" fill="#cccccc" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">100 Yards Out</text>
</svg>
</div>
</body>
</html>
