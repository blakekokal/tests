<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Full Hole Breakdown</title></head>
<body style="background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;">
<div style="width:380px;">
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <defs>
    <linearGradient id="grass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1f0d" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="380" height="240" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="190" y="28" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Full Hole Breakdown</text>

  <!-- 3 Shots badge -->
  <rect x="155" y="36" width="70" height="20" rx="10" fill="#333333"/>
  <text x="190" y="50" fill="#aaaaaa" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">3 Shots</text>

  <!-- Ground -->
  <rect x="0" y="125" width="380" height="115" fill="url(#grass2)"/>

  <!-- Fairway path -->
  <path d="M35,188 Q120,175 200,155 Q275,135 335,105" fill="none" stroke="#2e7d32" stroke-width="30" stroke-linecap="round" opacity="0.4"/>

  <!-- Putting green -->
  <ellipse cx="338" cy="90" rx="32" ry="26" fill="#1b5e20" opacity="0.7"/>
  <ellipse cx="338" cy="90" rx="26" ry="20" fill="#2e7d32" opacity="0.8"/>

  <!-- Flag -->
  <line x1="342" y1="90" x2="342" y2="58" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="342,58 357,63 342,68" fill="#f44336"/>

  <!-- Tee box -->
  <rect x="20" y="184" width="22" height="10" rx="3" fill="#388e3c"/>
  <circle cx="31" cy="182" r="4" fill="#ffffff"/>

  <!-- TEE label -->
  <text x="31" y="210" fill="#888888" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">TEE</text>

  <!-- Shot 1: Tee → Fairway (250 yards) -->
  <path d="M31,182 Q100,95 198,155" fill="none" stroke="#64b5f6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="198" cy="155" r="6" fill="#ffffff" stroke="#64b5f6" stroke-width="2"/>

  <!-- Shot 1 label -->
  <rect x="65" y="100" width="80" height="22" rx="11" fill="#1565c0" opacity="0.9"/>
  <text x="105" y="115" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">250 Yards</text>

  <!-- "Fairway" label at landing -->
  <text x="198" y="175" fill="#cccccc" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Fairway</text>

  <!-- Shot 2: Approach → Green (150 yards to 10ft) -->
  <path d="M198,155 Q270,85 325,93" fill="none" stroke="#66bb6a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="325" cy="93" r="6" fill="#ffffff" stroke="#66bb6a" stroke-width="2"/>

  <!-- Shot 2 label -->
  <rect x="225" y="72" width="80" height="22" rx="11" fill="#2e7d32" opacity="0.9"/>
  <text x="265" y="87" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">150 Yards</text>

  <!-- "Green" label -->
  <text x="338" y="123" fill="#66bb6a" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Green</text>

  <!-- Shot 3: Putt (10 ft) -->
  <path d="M325,93 Q334,88 340,90" fill="none" stroke="#ce93d8" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="340" cy="90" r="4" fill="#ce93d8"/>

  <!-- Putt label -->
  <rect x="295" y="45" width="90" height="22" rx="11" fill="#7b1fa2" opacity="0.85"/>
  <text x="340" y="60" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">10 Foot Putt</text>

  <!-- "Putt Holed" label -->
  <text x="340" y="35" fill="#ce93d8" font-family="system-ui,sans-serif" font-size="10" font-weight="800" text-anchor="middle">Putt Holed!</text>
</svg>
</div>
</body>
</html>
